# Root docker-compose.yml — one command starts everything:
#   docker compose up --build
#
# What this runs:
#   mssql-product-db  → SQL Server for ProductService  (host port 1433)
#   mssql-order-db    → SQL Server for OrderService    (host port 1434)
#   rabbitmq          → RabbitMQ message broker        (AMQP 5672, UI 15672)
#   productservice    → ProductService Web API         (host port 5043)
#   orderservice      → OrderService Web API           (host port 5044)
#   myclient          → Blazor WASM via nginx          (host port 5200)
#
# Open http://localhost:5200 in your browser after it starts.

networks:
  microservices-net:
    driver: bridge

services:

  # ── Databases ──────────────────────────────────────────────────────────────

  mssql-product-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-product-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "P@ssw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"   # exposed to host so 'dotnet ef migrations add' still works locally
    volumes:
      - mssqlproductdata:/var/opt/mssql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "P@ssw0rd", "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10
      start_period: 30s

  mssql-order-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-order-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "P@ssw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"   # different host port to avoid clash with product DB
    volumes:
      - mssqlorderdata:/var/opt/mssql
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "P@ssw0rd", "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10
      start_period: 30s

  # ── Message Broker ────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP protocol port (used by services)
      - "15672:15672"  # RabbitMQ management UI → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 10
      start_period: 30s

  # ── API Services ───────────────────────────────────────────────────────────

  productservice:
    build:
      context: .
      dockerfile: ProductService/Dockerfile
    container_name: productservice
    ports:
      - "5043:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mssql-product-db,1433;Database=MyDbName;User Id=sa;Password=P@ssw0rd;TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    networks:
      - microservices-net
    depends_on:
      mssql-product-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orderservice:
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    container_name: orderservice
    ports:
      - "5044:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mssql-order-db,1433;Database=OrderDb;User Id=sa;Password=P@ssw0rd;TrustServerCertificate=True;
      # Service-to-service: OrderService calls ProductService by Docker container name, not localhost
      - ProductServiceUrl=http://productservice:8080
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    networks:
      - microservices-net
    depends_on:
      mssql-order-db:
        condition: service_healthy
      productservice:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # ── Client ─────────────────────────────────────────────────────────────────

  myclient:
    build:
      context: ./MyClient
      dockerfile: Dockerfile
    container_name: myclient
    ports:
      - "5200:80"
    networks:
      - microservices-net
    depends_on:
      - productservice
      - orderservice

volumes:
  mssqlproductdata:
  mssqlorderdata:
