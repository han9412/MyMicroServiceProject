# Debug override — use together with the root docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up --build
#
# This replaces only the productservice build so it uses Dockerfile.debug,
# which compiles in Debug mode and ships vsdbg for VS Code attach.

services:
  productservice:
    build:
      context: .
      dockerfile: ProductService/Dockerfile.debug
  orderservice:
    build:
      context: .
      dockerfile: OrderService/Dockerfile.debug
