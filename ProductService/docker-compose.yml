services:
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "P@ssw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"  # Exposes DB to your Ubuntu host so 'dotnet ef' can see it
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "P@ssw0rd", "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10
      start_period: 30s

  productservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productservice
    ports:
      - "5043:8080"  # Host port 5043 → container port 8080 (ASP.NET Core default)
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=mssql-db,1433;Database=MyDbName;User Id=sa;Password=P@ssw0rd;TrustServerCertificate=True;
    depends_on:
      mssql-db:
        condition: service_healthy

volumes:
  mssqldata: